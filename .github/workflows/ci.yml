name: CI

on:
  push:
    branches: [develop, master, 'feat/**', 'release/**']
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} unit tests and static analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: plugins/quant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/phpunit
      - run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      - run: ./vendor/bin/phpmd src text phpmd.xml

  js:
    name: Admin and frontend assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/quant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/quant/package-lock.json
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run build
      - name: Built assets are committed
        run: git diff --exit-code -- assets/build || (echo "Run npm run build and commit assets/build" && exit 1)

  e2e:
    name: End-to-end (WordPress + mock Quant API)
    runs-on: ubuntu-latest
    needs: [php, js]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-dev
        working-directory: plugins/quant
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm run setup
        working-directory: tests/e2e
      - run: E2E_SKIP_SETUP=1 npx playwright test --reporter=line
        working-directory: tests/e2e
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yml logs --no-color mock-api | tail -n 200
          docker compose -f docker-compose.e2e.yml exec -T wordpress sh -c 'tail -n 200 /var/www/html/wp-content/debug.log || true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-output
          path: tests/e2e/output
          if-no-files-found: ignore

  upgrade:
    name: In-place upgrade from the published 1.x plugin
    runs-on: ubuntu-latest
    needs: [php, js]
    strategy:
      fail-fast: false
      matrix:
        from: ['1.6.0', '1.4.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
        working-directory: plugins/quant
      - run: tests/e2e/bin/upgrade-test.sh ${{ matrix.from }}
